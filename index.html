<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Кабинет ученика</title>

<style>
:root{
  --main:#8153EC; --second:#C653EC;
  --bg:#F6F2FE; --card:#FFFFFF; --text:#1F1633; --muted:#7A7191; --line:#ECE6F8;
  --ok:#2E9E6A; --okbg:#E3F5EC; --bad:#D9455F; --badbg:#FCE6EA; --mid:#C98A12; --midbg:#FDF1DC; --info:#5B6BE0; --infobg:#E7EAFC; --grey:#EEEBF3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:720px;margin:0 auto;font-size:15px}
h1{font-size:26px;font-weight:800;line-height:1.15}
h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(129,83,236,.07)}
.head{background:linear-gradient(135deg,var(--main),var(--second));color:#fff;border-radius:22px;padding:20px;margin-top:0}
.head .sub{color:rgba(255,255,255,.8)}
.tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;margin-top:10px;margin-right:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(129,83,236,.07)}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--main);line-height:1.1}
.kpi.accent{background:var(--main)} .kpi.accent b,.kpi.accent span{color:#fff}
.kpi b small{font-size:16px;font-weight:700}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--main);box-shadow:0 1px 4px rgba(129,83,236,.15)}
.kpi span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block;margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap}
td.big{font-weight:800;color:var(--main)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:10px}
.t{border-radius:12px;padding:8px 4px;text-align:center}
.t i{display:block;font-style:normal;font-size:11px;opacity:.75}
.t b{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.lesson{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lesson:last-child{border:0}
.lesson .d{min-width:46px;font-weight:800;color:var(--main);font-size:14px}
.lesson .tt{flex:1}
.pills{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px}
.p-prac{background:#F3EAFD;color:#8E3BC0}
.p-ok{background:var(--okbg);color:var(--ok)} .p-bad{background:var(--badbg);color:var(--bad)}
.p-mid{background:var(--midbg);color:var(--mid)} .p-info{background:var(--infobg);color:var(--info)} .p-grey{background:var(--grey);color:var(--muted)}
.comment{border-left:4px solid var(--second);padding-left:12px;margin-top:8px;line-height:1.45}
.more{display:block;width:100%;margin-top:10px;background:var(--bg);border:0;border-radius:12px;padding:10px;color:var(--main);font-weight:700;font-size:14px}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.login input{width:100%;font-size:22px;letter-spacing:3px;text-transform:uppercase;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);margin-top:16px;outline:none}
.login input:focus{border-color:var(--main)}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--main),var(--second));color:#fff;font-size:17px;font-weight:800}
.err{color:var(--bad);margin-top:10px;text-align:center;font-size:14px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 6px}
.foot a{color:var(--main)}
.hidden{display:none}
tr.mrow-t{cursor:pointer}
tr.mrow-t .chev{color:#B9AEDB;font-size:12px;display:inline-block;transition:transform .2s}
tr.mrow-t.open .chev{transform:rotate(180deg)}
tr.mrow-t.open td{border-bottom:0}
tr.mdet td{padding:0 0 12px}
.mdinfo{font-size:12px;color:var(--muted);margin:2px 0 -2px}
.th{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 4px}
.th:first-of-type{margin-top:8px}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border:0}
.trow .tm{min-width:46px;font-weight:800;color:var(--main);font-size:14px}
.trow .tn{flex:1;font-weight:700}
.trow .tn small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:1px}
.trow .tx{font-size:13px;color:var(--muted);text-align:right}
.lrow{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:2px 0}
.lrow:last-child{border:0}
.lrow .tm{min-width:46px;font-weight:800;color:var(--main);font-size:14px;padding-top:12px}
.lrow .lmem{flex:1;min-width:0}
.trow.mrow{border-bottom:1px dashed var(--line)}
.trow.mrow:last-child{border:0}
.trow .arrow{color:#C9BFE0;font-size:18px}
.back{display:inline-block;margin-bottom:12px;background:#fff;border:0;border-radius:12px;padding:9px 14px;color:var(--main);font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(129,83,236,.07)}
.paycard{display:flex;align-items:center;gap:12px;padding:14px 16px}
.paycard .pv{flex:1;font-weight:800;font-size:16px}
.paycard .pv span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.paycard.debt{background:var(--badbg)} .paycard.debt .pv{color:var(--bad)}
.paycard.ahead .pv{color:var(--ok)}
.hwcard .info b{display:block;font-size:16px;margin-top:2px}
.hwcard .note{margin-top:6px;line-height:1.4;white-space:pre-line}
.hwbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hwbtn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--main),var(--second));color:#fff;font-weight:800;font-size:14px;text-decoration:none}
.jnote{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-line}
.pill.p-link{background:#F3EAFD;color:var(--main);text-decoration:none}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sec{background:var(--bg);border-radius:14px;padding:12px 10px}
.sec:last-child:nth-child(odd){grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.sec:last-child:nth-child(odd) h3,.sec:last-child:nth-child(odd) .nums,.sec:last-child:nth-child(odd) .none:only-of-type{grid-column:1/-1}
.sec h3{font-size:14px;font-weight:800;margin-bottom:2px}
.sec .nums{font-size:11px;color:var(--muted);margin-bottom:6px}
.sec .row{margin-top:6px}
.sec .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.sec .val{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.sec .val b{font-size:22px;font-weight:800;color:var(--main)}
.tr{font-size:12px;font-weight:800;border-radius:10px;padding:1px 7px}
.tr.up{background:var(--okbg);color:var(--ok)} .tr.down{background:var(--badbg);color:var(--bad)} .tr.flat{background:var(--grey);color:var(--muted)}
.sec svg{width:100%;height:30px;display:block;margin-top:2px}
.sec .cap{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.sec .none{font-size:12px;color:#A39BB5;margin-top:6px}
</style>
</head>

/* демо: баллы по заданиям в пробниках */
(function(){const slope={g:.09,n:.1,o:[0,.12,.22,.2,.13],l:.03,c:.06};
  const sec=t=>[10,11,12,13,14,15,16,32,33].includes(t)?"o":[6,7,8,9,29,30,31].includes(t)?"n":[24,25].includes(t)?"l":[26,27,28,34].includes(t)?"c":"g";
  DEMO.mocksList.forEach((m,k)=>{m.scores=DEMO.maxes.map((mx,i)=>{const s=sec(i+1);
    const base=(s==="c"?.2:.3)+(s==="o"?slope.o[k]:slope[s]*k)+((i*7+k*3)%5)*.04;return Math.max(0,Math.min(mx,Math.round(mx*base)));});});})();
const tg = window.Telegram && Telegram.WebApp; try{tg&&tg.ready();tg&&tg.expand();}catch(e){}
const $ = s=>document.querySelector(s);
const store={get(){try{return localStorage.getItem("cab_code")}catch(e){return null}},set(v){try{localStorage.setItem("cab_code",v)}catch(e){}},del(){try{localStorage.removeItem("cab_code")}catch(e){}}};
const pct=v=>v===""||v==null?"—":Math.round(v*100)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pillCls={"Проведено":"p-ok","Выполнено":"p-ok","Пропуск":"p-bad","Не выполнено":"p-bad","Частично":"p-mid","Перенос":"p-mid","Задано":"p-info","Отмена":"p-grey","Не задано":"p-grey"};
const pill=(t,pre="")=>t?`<span class="pill ${pillCls[t]||"p-grey"}">${pre}${esc(t)}</span>`:"";

function chart(list,goal,exam){
  if(!list.length) return `<p class="sub" style="margin-top:8px">Пробников пока нет</p>`;
  const W=640,H=230,P={l:34,r:18,t:20,b:34};
  const maxY = exam==="ЕГЭ"?100:38;
  const xs=i=>P.l+(list.length===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(list.length-1));
  const ys=v=>P.t+(1-v/maxY)*(H-P.t-P.b);
  let g="";
  const ticks = exam==="ЕГЭ"?[0,25,50,75,100]:[0,10,20,30,38];
  ticks.forEach(t=>g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${ys(t)}" y2="${ys(t)}" stroke="#ECE6F8"/><text x="${P.l-8}" y="${ys(t)+4}" font-size="11" fill="#7A7191" text-anchor="end">${t}</text>`);
  if(goal && exam==="ЕГЭ") g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${ys(goal)}" y2="${ys(goal)}" stroke="#C653EC" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${W-P.r}" y="${ys(goal)-6}" font-size="11" fill="#C653EC" text-anchor="end" font-weight="700">цель ${goal}</text>`;
  const pts=list.map((m,i)=>[xs(i),ys(m.result)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const area=path+` L${pts.at(-1)[0]} ${H-P.b} L${pts[0][0]} ${H-P.b} Z`;
  g+=`<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#8153EC"/><stop offset="1" stop-color="#C653EC"/></linearGradient>
      <linearGradient id="ar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8153EC" stop-opacity=".22"/><stop offset="1" stop-color="#8153EC" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#ar)"/><path d="${path}" fill="none" stroke="url(#ln)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  list.forEach((m,i)=>{const [x,y]=pts[i];
    g+=`<circle cx="${x}" cy="${y}" r="5.5" fill="#fff" stroke="#8153EC" stroke-width="3"/><text x="${x}" y="${y-12}" font-size="13" font-weight="800" fill="#1F1633" text-anchor="middle">${m.result}</text>
        <text x="${x}" y="${H-12}" font-size="11" fill="#7A7191" text-anchor="middle">${esc(String(m.date).slice(0,5))}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* Разделы для блока «Освоение разделов». Номера заданий можно менять тут. */
const SECTIONS={

  "ОГЭ":null
};
const MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function ranges(a){const r=[];let s=a[0],p=a[0];for(const x of a.slice(1).concat([null])){if(x===p+1){p=x;continue}r.push(s===p?s:s+"–"+p);s=p=x}return r.join(", ")}
function spark(vals){
  if(vals.length<2) return "";
  const W=160,H=30,pad=4;const lo=Math.max(0,Math.min(...vals)-.1),hi=Math.min(1,Math.max(...vals)+.1);
  const xs=i=>pad+i*(W-2*pad)/(vals.length-1),ys=v=>H-pad-(v-lo)/((hi-lo)||1)*(H-2*pad);
  const d=vals.map((v,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="url(#ln2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${xs(vals.length-1)}" cy="${ys(vals.at(-1))}" r="3" fill="#8153EC"/></svg>`;
}
function trend(vals,what){
  if(vals.length<2) return "";
  const dlt=Math.round((vals.at(-1)-vals.at(-2))*100);
  if(Math.abs(dlt)<3) return `<span class="tr flat">≈ ${dlt>0?"+":""}${dlt}%</span>`;
  return dlt>0?`<span class="tr up">▲ +${dlt}%</span>`:`<span class="tr down">▼ ${dlt}%</span>`;
}
function parseHw(text){
  const links=[],notes=[];
  String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const urls=line.match(/https?:\/\/[^\s,;]+/g);
    if(!urls){notes.push(line);return;}
    const label=line.replace(/https?:\/\/[^\s,;]+/g,"").replace(/[\s:—–\-|,;]+$/,"").replace(/^[\s:—–\-|,;]+/,"").trim();
    urls.forEach((u,i)=>links.push({url:u,label:urls.length===1&&label?label:""}));
  });
  links.forEach((l,i)=>{if(!l.label)l.label=links.length>1?"Ссылка "+(i+1):"Открыть ДЗ"});
  return {note:notes.join("\n"),links};
}
const pd=x=>{const [dd,mm,yy]=String(x||"").split(".");const t=new Date(+yy,+mm-1,+dd);return isNaN(t)?null:t};
const DAY=864e5, HW_DAYS=30;
function sectionsHtml(d){
  const cfg=SECTIONS[d.exam]; if(!cfg) return "";
  const passed=d.passed||[];
  const dates=(d.journal||[]).map(l=>pd(l.date)).filter(Boolean);
  const ref=API_URL?new Date():new Date(Math.max(...dates,0)); // в демо — от последней даты
  const cards=cfg.map(sec=>{
    const head=`<h3>${esc(sec.name)}</h3><div class="nums">задания ${ranges(sec.tasks)}</div>`;
    // Пробники: только пройденные (✓) задания раздела
    const ts=sec.tasks.filter(t=>passed.includes(t));
    let mockRow;
    const mocks=(d.mocksList||[]).filter(m=>m.scores);
    if(!ts.length) mockRow=`<div class="none">раздел ещё не проходили</div>`;
    else if(!mocks.length) mockRow=`<div class="none">пробников пока нет</div>`;
    else{
      const mx=ts.reduce((a,t)=>a+d.maxes[t-1],0);
      const mv=mocks.map(m=>ts.reduce((a,t)=>a+(+m.scores[t-1]||0),0)/mx);
      const cov=ts.length===sec.tasks.length?"все задания раздела":`по № ${ranges(ts)} (${ts.length} из ${sec.tasks.length})`;
      mockRow=`<div class="val"><b>${Math.round(mv.at(-1)*100)}%</b>${trend(mv)}</div>${spark(mv)}`;
    }
    // ДЗ: все задания раздела, которые были в ДЗ за последние 30 дней (и предыдущие 30 — для стрелки)
    const win=(from,to)=>{let ok=0,t=0;const ns=new Set();
      (d.journal||[]).forEach(l=>{const dt=pd(l.date);if(!dt||dt<=from||dt>to)return;
        (l.practice||[]).forEach(p=>{if(!sec.tasks.includes(+p.n)||!(+p.total))return;ok+=+p.ok;t+=+p.total;ns.add(+p.n);});});
      return {v:t?ok/t:null,ns:[...ns].sort((a,b)=>a-b)};};
    const cur=win(new Date(ref-HW_DAYS*DAY),ref), prev=win(new Date(ref-2*HW_DAYS*DAY),new Date(ref-HW_DAYS*DAY));
    const hwRow=cur.v==null?`<div class="none">не было в ДЗ</div>`:
      `<div class="val"><b>${Math.round(cur.v*100)}%</b>${prev.v==null?"":trend([prev.v,cur.v])}</div>`;
    return `<div class="sec">${head}${mocks.length?`<div class="row"><div class="lbl">Пробники</div>${mockRow}</div>`:""}<div class="row"><div class="lbl">ДЗ за ${HW_DAYS} дней</div>${hwRow}</div></div>`;
  }).join("");
  return `<div class="card"><h2>Освоение разделов</h2>
    <div class="sub">${(d.mocksList||[]).length?`% — решаемость в последнем пробнике и в ДЗ за ${HW_DAYS} дней, график — динамика по пробникам`:`% — решаемость в ДЗ за ${HW_DAYS} дней`}</div>
    <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ln2" gradientUnits="userSpaceOnUse" x1="0" x2="160" y1="0" y2="0"><stop offset="0" stop-color="#8153EC"/><stop offset="1" stop-color="#C653EC"/></linearGradient></defs></svg>
    <div class="secs">${cards}</div></div>`;
}

function mockDetail(m,d){
  if(!m.scores) return "";
  const cells=m.scores.map((v,i)=>{const mx=d.maxes[i]||1,r=(+v||0)/mx;
    const c=r>=1?"var(--okbg);color:var(--ok)":r>0?"var(--midbg);color:var(--mid)":"var(--badbg);color:var(--bad)";
    return `<div class="t" style="background:${c}"><i>№${i+1}</i><b>${+v||0}/${mx}</b></div>`;}).join("");
  const full=m.scores.filter((v,i)=>(+v||0)>=(d.maxes[i]||1)).length, zero=m.scores.filter(v=>!(+v)).length;
  return `<div class="mdinfo">${esc(m.title||"")}${m.title?" · ":""}полностью решено ${full} из ${m.scores.length} · не решено ${zero}</div><div class="tasks">${cells}</div>`;
}
function tasks(solv,maxes,passed){
  return solv.map((v,i)=>{
    if(passed && !passed.includes(i+1)) return `<div class="t" style="background:#F4F1FA;color:#A39BB5"><i>№${i+1}</i><b style="font-size:11px">не прох.</b></div>`;
    if(v===""||v==null) return `<div class="t" style="background:#F4F1FA"><i>№${i+1}</i><b>—</b></div>`;
    let bg,fg;
    if(v<0.745){bg="var(--badbg)";fg="var(--bad)"} else if(v<0.895){bg="var(--midbg)";fg="var(--mid)"} else {bg="var(--okbg)";fg="var(--ok)"}
    return `<div class="t" style="background:${bg};color:${fg}"><i>№${i+1}</i><b>${Math.round(v*100)}%</b></div>`;
  }).join("");
}

function render(d){
  const m=d.metrics, ege=d.exam==="ЕГЭ";
  const unit= ege?"тестовый балл":"первичный балл";
  const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;return n>10&&n<20?c:n1>1&&n1<5?b:n1===1?a:c};
  const sign=v=>v===""||v==null?"—":(v>0?"+":"")+v;
  let journalShown=8;
  const hasM=(d.mocksList||[]).length>0;
  const bal=d.balance===""||d.balance==null?null:Math.round(+d.balance*10)/10;
  const nz=n=>n+" "+plural(n,"занятие","занятия","занятий");
  const payHtml=bal===null||isNaN(bal)?"":bal<0
    ?`<div class="card paycard debt"><div class="pv"><span>Оплата</span>Не оплачено ${nz(-bal)}</div>${d.payUrl?`<a class="hwbtn" href="${esc(d.payUrl)}" data-link="${esc(d.payUrl)}">Оплатить</a>`:""}</div>`
    :bal>0?`<div class="card paycard ahead"><div class="pv"><span>Оплата</span>Оплачено на ${nz(bal)} вперёд</div></div>`
    :`<div class="card paycard"><div class="pv"><span>Оплата</span>Все занятия оплачены</div></div>`;
  (d.journal||[]).forEach(l=>{l.hwp=parseHw(l.hwText||l.hwLink||"")});
  const curHw=(d.journal||[]).filter(l=>(l.hwp.links.length||l.hwp.note)&&pd(l.date)).sort((a,b)=>pd(b.date)-pd(a.date))[0];
  const last3=(d.mocksList||[]).filter(m=>m.scores).slice(-3);
  const jds=(d.journal||[]).map(l=>pd(l.date)).filter(Boolean);
  const refD=API_URL?new Date():new Date(Math.max(...jds,0)), fromD=new Date(refD-HW_DAYS*DAY);
  const agg=d.maxes.map(()=>({ok:0,t:0}));
  (d.journal||[]).forEach(l=>{const dt=pd(l.date);if(!dt||dt<=fromD||dt>refD)return;
    (l.practice||[]).forEach(p=>{const i=+p.n-1;if(agg[i]&&+p.total){agg[i].ok+=+p.ok;agg[i].t+=+p.total;}});});
  const solvH=agg.map(a=>a.t?a.ok/a.t:"");
  const solvM=last3.length?d.maxes.map((mx,i)=>last3.reduce((a,m)=>a+(+m.scores[i]||0),0)/(last3.length*mx)):d.solv;
  const firstMock=(d.mocksList||[]).length?d.mocksList[0].date:"";
  const jd=(d.journal||[]).filter(l=>pd(l.date)).sort((a,b)=>pd(a.date)-pd(b.date));
  const firstLesson=jd.length?jd[0].date:"";
  const jHtml=n=>d.journal.slice(0,n).map(l=>`<div class="lesson"><div class="d">${esc(String(l.date).slice(0,5))}</div><div class="tt">${esc(l.topic)}
      ${l.hwp.note?`<div class="jnote">${esc(l.hwp.note)}</div>`:""}${(l.hwPct!==""&&l.hwPct!=null)||l.hwp.links.length?`<div class="pills">${l.hwPct!==""&&l.hwPct!=null?`<span class="pill ${l.hwPct>=0.895?"p-ok":l.hwPct>=0.745?"p-mid":"p-bad"}">ДЗ ${pct(l.hwPct)}</span>`:""}${l.hwp.links.map(k=>`<a class="pill p-link" href="${esc(k.url)}" data-link="${esc(k.url)}">${esc(l.hwp.links.length>1?k.label:"ДЗ")} →</a>`).join("")}</div>`:""}</div></div>`).join("");
  $("#app").innerHTML=`${TEACHER_VIEW?`<button class="back" id="back">← Все ученики</button>`:""}
  <div class="card head">
    <div class="sub">${esc(d.exam)} · химия</div>
    <h1>${esc(d.name)}</h1>
    ${d.goal!==""&&d.goal!=null&&String(d.goal).trim()!==""?`<span class="tag">Цель: ${esc(d.goal)}${ege&&!isNaN(+d.goal)?" "+plural(+d.goal,"балл","балла","баллов"):""}</span>`:""}
  </div>
  <div class="kpis">
    ${hasM?`<div class="kpi accent"><b>${m.last===""?"—":m.last}<small>${m.last===""?"":" "+plural(m.last,"балл","балла","баллов")}</small></b><span>последний результат${ege?"":" · оценка "+(m.grade||"—")}</span></div>
    <div class="kpi"><b>${sign(m.growth)}<small> ${m.growth===""||m.growth==null?"":plural(m.growth,"балл","балла","баллов")}</small></b><span>рост от ${esc(firstMock||"старта")}</span></div>`:""}
    <div class="kpi"><b>${m.lessons}</b><span>занятий проведено${firstLesson?" с "+esc(firstLesson):""}${m.missed?` · пропусков ${m.missed}`:""}</span></div>
    <div class="kpi"><b>${pct(m.hwAvg)}</b><span>средний % выполнения ДЗ</span></div>
  </div>
  ${payHtml}
  ${curHw?`<div class="card hwcard"><div class="info"><div class="sub">Домашнее задание · ${esc(String(curHw.date).slice(0,5))}</div><b>${esc(curHw.topic||"ДЗ")}</b></div>
    ${curHw.hwp.note?`<div class="note">${esc(curHw.hwp.note)}</div>`:""}
    ${curHw.hwp.links.length?`<div class="hwbtns">${curHw.hwp.links.map(k=>`<a class="hwbtn" href="${esc(k.url)}" data-link="${esc(k.url)}">${esc(k.label)}</a>`).join("")}</div>`:""}</div>`:""}
  ${d.comment?`<div class="card"><h2>Комментарий преподавателя</h2><div class="comment">${esc(d.comment)}</div></div>`:""}
  ${hasM?`<div class="card chart"><h2>Динамика пробников</h2><div class="sub">${unit} по пробникам</div>${chart(d.mocksList,d.goal,d.exam)}</div>
  <div class="card"><h2>Пробники</h2>
    <table><tr><th>Дата</th><th class="n">Перв.</th><th class="n">${ege?"Тест.":"Оценка"}</th></tr>
    ${d.mocksList.slice().reverse().map((x,k)=>`<tr class="mrow-t" data-m="${k}"><td><b>${esc(x.date)}</b> <span class="chev">▾</span></td><td class="n">${x.primary}</td><td class="n big">${x.result}</td></tr>
      <tr class="mdet hidden" id="md${k}"><td colspan="3">${mockDetail(x,d)}</td></tr>`).join("")}</table>
    <div class="sub" style="margin-top:8px">Нажмите на пробник, чтобы увидеть баллы по заданиям</div>
  </div>`:""}
  ${sectionsHtml(d)}
  <div class="card"><h2>Решаемость по заданиям</h2><div class="sub" id="solvSub">${hasM?"средний % от максимума по последним 3 пробникам":`% верно решённых задач каждого номера в ДЗ за последние ${HW_DAYS} дней`}</div>
    ${hasM?`<div class="seg"><button class="on" data-s="mocks">Пробники</button><button data-s="hw">Домашние задания</button></div>`:""}
    <div class="tasks" id="solvGrid">${tasks(hasM?solvM:solvH,d.maxes,d.passed)}</div>
  </div>
  <div class="card"><h2>Журнал занятий</h2><div id="jl">${jHtml(journalShown)}</div>
    ${d.journal.length>journalShown?`<button class="more" id="more">Показать все занятия (${d.journal.length})</button>`:""}</div>
  <div class="foot">${API_URL?`<a href="#" id="refresh">Обновить данные</a> · <a href="#" id="logout">Выйти / другой код</a>`:"Демо-режим: данные примера"}</div>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
    const les=b.dataset.s==="hw";
    $("#solvGrid").innerHTML=tasks(les?solvH:solvM,d.maxes,d.passed);
    $("#solvSub").textContent=les?`% верно решённых задач каждого номера в ДЗ за последние ${HW_DAYS} дней`:"средний % от максимума по последним 3 пробникам";});
  document.getElementById("app").onclick=e=>{const a=e.target.closest("[data-link]");if(!a)return;e.preventDefault();
    const u=a.dataset.link;try{if(tg&&tg.openLink){tg.openLink(u);return;}}catch(_){}window.open(u,"_blank");};
  document.querySelectorAll("tr.mrow-t").forEach(tr=>tr.addEventListener("click",()=>{
    const det=document.getElementById("md"+tr.dataset.m); det.classList.toggle("hidden"); tr.classList.toggle("open");}));
  const mb=$("#more"); if(mb) mb.onclick=()=>{$("#jl").innerHTML=jHtml(999);mb.remove();};
  const bk=$("#back"); if(bk) bk.onclick=()=>{renderTeacher(TEACHER_VIEW);window.scrollTo(0,0);};
  const rf=$("#refresh"); if(rf) rf.onclick=e=>{e.preventDefault();const c=store.get();if(c)load(c);};
  const lo=$("#logout"); if(lo) lo.onclick=e=>{e.preventDefault();store.del();location.reload();};
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
}

// Вход без кода: Telegram передаёт подписанные данные пользователя, скрипт находит ученика по подписке в боте
let TEACHER_VIEW=null;
const pl=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c};
function renderTeacher(d){
  TEACHER_VIEW=d;
  const ST={soon:["впереди","p-grey"],now:["идёт","p-info"],sent:["ДЗ отправлено","p-ok"],hw_not_sent:["ДЗ не отправлено","p-mid"],no_hw:["нет ДЗ","p-bad"]};
  const row=(x,mid,right)=>`<div class="trow" data-code="${esc(x.code||"")}">${mid}<div class="tx">${right}</div>${x.code?`<span class="arrow">›</span>`:""}</div>`;
  const mem=(x,first,les)=>`<div class="trow mrow" data-code="${esc(x.code||"")}"><div class="tn">${esc(x.name)}${first?`<small>до ${esc(les.end)}${les.members.length>1?" · пара":""}</small>`:""}</div><div class="tx"><span class="pill ${ST[x.state][1]}">${ST[x.state][0]}</span></div>${x.code?`<span class="arrow">›</span>`:""}</div>`;
  const today=d.today.length?d.today.map(l=>`<div class="lrow"><div class="tm">${esc(l.time)}</div><div class="lmem">${(l.members||[]).map((x,i,arr)=>mem(x,i===arr.length-1,l)).join("")}</div></div>`).join(""):`<p class="sub" style="margin-top:8px">Уроков по календарю нет</p>`;
  const grp=(title,list,fn)=>list.length?`<div class="th">${title}</div>`+list.map(x=>row(x,`<div class="tn">${esc(x.name)}</div>`,fn(x))).join(""):"";
  const att=grp("ДЗ не отправлено",d.notSent,x=>"от "+x.dates.join(", "))+grp("Не проверено ДЗ",d.pending,x=>"от "+x.dates.join(", "))
    +grp("Ждём оплату",d.debt,x=>`<span class="pill p-bad">${x.n} ${pl(x.n,"занятие","занятия","занятий")}</span>`)
    +grp("Давно не было пробника",d.mocks,x=>x.weeks+" нед.");
  const pendN=d.pending.reduce((a,x)=>a+x.dates.length,0), debtN=d.debt.reduce((a,x)=>a+x.n,0);
  const bal=b=>b===""||b==null?"":b<0?`<span class="pill p-bad">−${-b}</span>`:b>0?`<span class="pill p-ok">+${b}</span>`:`<span class="pill p-grey">0</span>`;
  const studs=d.students.map(x=>row(x,`<div class="tn">${esc(x.name)}<small>${esc(x.exam)}${x.last!==""?" · последний "+x.last:""}${x.hwAvg!==""?" · ДЗ "+pct(x.hwAvg):""}</small></div>`,bal(x.balance))).join("");
  $("#app").innerHTML=`
  <div class="card head"><div class="sub">Кабинет преподавателя</div><h1>Сегодня, ${esc(d.date.slice(0,5))}</h1></div>
  <div class="kpis">
    <div class="kpi accent"><b>${d.today.length}</b><span>${pl(d.today.length,"урок","урока","уроков")} сегодня</span></div>
    <div class="kpi"><b>${pendN}</b><span>не проверено ДЗ</span></div>
    <div class="kpi"><b>${debtN}</b><span>${pl(debtN,"занятие","занятия","занятий")} ждут оплаты</span></div>
    <div class="kpi"><b>${d.students.length}</b><span>${pl(d.students.length,"ученик","ученика","учеников")}</span></div>
  </div>
  <div class="card"><h2>Уроки сегодня</h2>${today}</div>
  <div class="card"><h2>Требует внимания</h2>${att||`<p class="sub" style="margin-top:8px">Всё в порядке</p>`}</div>
  <div class="card"><h2>Все ученики</h2><div class="sub">баланс: + оплачено вперёд, − не оплачено</div>${studs}</div>
  <div class="foot"><a href="#" id="trefresh">Обновить данные</a> · <a href="#" id="logout">Выйти</a></div>`;
  $("#app").onclick=e=>{const r=e.target.closest(".trow[data-code]");if(r&&r.dataset.code)openStudent(r.dataset.code);};
  $("#trefresh").onclick=e=>{e.preventDefault();const c=store.get();if(c)load(c);else if(tg&&tg.initData)loadTg(tg.initData);};
  $("#logout").onclick=e=>{e.preventDefault();store.del();TEACHER_VIEW=null;showLogin();};
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
}
async function openStudent(code){
  try{
    const r=await fetch(API_URL+"?code="+encodeURIComponent(code)+"&t="+Date.now(),{cache:"no-store"});
    const d=await r.json(); if(d.error) return;
    $("#app").onclick=null; render(d); window.scrollTo(0,0);
  }catch(e){}
}
async function loadTg(initData){
  $("#login").classList.remove("hidden"); $("#err").textContent="Загружаю…";
  try{
    const r=await fetch(API_URL+"?tg="+encodeURIComponent(initData)+"&t="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(d.error){$("#err").textContent="";showLogin();return;}
    if(d.role==="teacher"){renderTeacher(d);return;}
    if(d.code) store.set(d.code);
    render(d);
  }catch(e){$("#err").textContent="";showLogin();}
}
async function load(code){
  $("#err").textContent="Загружаю…";
  try{
    const r=await fetch(API_URL+"?code="+encodeURIComponent(code)+"&t="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(d.error){$("#err").textContent="Код не найден. Проверьте и попробуйте ещё раз.";store.del();showLogin();return;}
    store.set(code);
    if(d.role==="teacher"){renderTeacher(d);return;}
    TEACHER_VIEW=null; render(d);
  }catch(e){$("#err").textContent="Не получилось загрузить данные. Попробуйте позже.";showLogin();}
}
function showLogin(){$("#app").classList.add("hidden");$("#login").classList.remove("hidden");}
$("#go").onclick=()=>{const c=$("#code").value.trim().toUpperCase(); if(c) load(c);};
$("#code").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click();});

if(!API_URL) render(DEMO);
else {
  const saved=store.get(), initData=tg&&tg.initData;
  if(saved) load(saved);
  else if(initData) loadTg(initData);
  else showLogin();
}
</script>
</body>
